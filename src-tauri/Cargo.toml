[package]
name = "moorai"
version = "1.19.2"
license = "MIT"
description = "MoorAI Managed AI Host"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: parse floats correctly rounded, so a signed policy's digest (clip_guard_policy.rs, which
# re-serialises the body as JavaScript would) sees the same number Node signed. A feature, not a crate.
serde_json = { version = "1", features = ["float_roundtrip"] }
portable-pty = "0.8"
tauri-plugin-updater = "2.10.1"
reqwest = { version = "0.13", features = ["blocking", "json", "query"] }
base64 = "0.22"
# keys-at-rest + running local AI (ai_keys.rs / ai_runtime.rs / content_hash.rs). All three were already
# in Cargo.lock as transitive deps of tauri/reqwest — no new crate enters the build.
sha2 = "0.10"
regex = "1"
url = "2"
# clip_guard_policy.rs: ed25519 verification of the signed policy envelope. Already in Cargo.lock as a
# transitive dep of reqwest's TLS stack — no new crate enters the build.
ring = "0.17"

# admin_config.rs: the user name from the OS user database (getpwuid_r) and O_NOFOLLOW opens of the admin
# sources. Already in Cargo.lock as a transitive dep of tauri/reqwest — no new crate enters the build.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# #23 — on-device OCR via Vision.framework. The recognition model ships with macOS, so these are
# binding crates only: nothing is added to the bundle and no image ever leaves the device.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-vision = "0.3"
# Clipboard guard (clip_guard_mac.rs): NSPasteboard changeCount / text and NSWorkspace's frontmost app.
# Already in Cargo.lock through tauri's windowing stack — no new crate enters the build.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSWorkspace", "NSRunningApplication"] }

# Native Windows security-posture inventory. `wmi` is the ergonomic serde layer over windows-rs
# (SecurityCenter2 AV/firewall, BitLocker); `winreg` covers firewall-profile + reboot-pending state.
[target.'cfg(windows)'.dependencies]
wmi = "0.14"
winreg = "0.52"
# Media_Ocr/Graphics_Imaging/Storage_Streams/Foundation_Collections are #23's on-device OCR engine —
# the Windows counterpart of Vision.framework, likewise shipped by the OS rather than bundled.
# Win32_System_DataExchange/Memory/LibraryLoader, Win32_UI_WindowsAndMessaging (+ Win32_Graphics_Gdi for
# RegisterClassW), UI_Notifications and
# Data_Xml_Dom are the clipboard guard's listener window, clipboard text and toast (clip_guard_win.rs).
windows = { version = "0.59", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Foundation", "Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Foundation_Collections", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "UI_Notifications", "Data_Xml_Dom"] }

# #39 — Linux on-device OCR. Linux ships no OS text-recognition engine, so this tier binds Tesseract
# via leptess (links system libtesseract/libleptonica). Opportunistic/second-class vs Vision & Windows
# OCR. Kept under the Linux target table so macOS/Windows builds never try to link libtesseract.
[target.'cfg(target_os = "linux")'.dependencies]
leptess = "0.14"

[lib]
name = "moorai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
