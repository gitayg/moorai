[package]
name = "moorai"
version = "0.64.0"
description = "MoorAI Managed AI Host"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
tauri-plugin-updater = "2.10.1"
reqwest = { version = "0.13", features = ["blocking", "json", "query"] }
base64 = "0.22"

# #23 — on-device OCR via Vision.framework. The recognition model ships with macOS, so these are
# binding crates only: nothing is added to the bundle and no image ever leaves the device.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-vision = "0.3"

# Native Windows security-posture inventory. `wmi` is the ergonomic serde layer over windows-rs
# (SecurityCenter2 AV/firewall, BitLocker); `winreg` covers firewall-profile + reboot-pending state.
[target.'cfg(windows)'.dependencies]
wmi = "0.14"
winreg = "0.52"
# Media_Ocr/Graphics_Imaging/Storage_Streams/Foundation_Collections are #23's on-device OCR engine —
# the Windows counterpart of Vision.framework, likewise shipped by the OS rather than bundled.
windows = { version = "0.59", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Foundation", "Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Foundation_Collections"] }

# #39 — Linux on-device OCR. Linux ships no OS text-recognition engine, so this tier binds Tesseract
# via leptess (links system libtesseract/libleptonica). Opportunistic/second-class vs Vision & Windows
# OCR. Kept under the Linux target table so macOS/Windows builds never try to link libtesseract.
[target.'cfg(target_os = "linux")'.dependencies]
leptess = "0.14"

[lib]
name = "moorai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
