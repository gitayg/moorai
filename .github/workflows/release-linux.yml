name: release-linux

# Builds the MoorAI Linux agent packages (scripts/build-linux-package.mjs: moorai_<v>_all.deb and
# moorai-<v>-linux.tar.gz, pure Node, no native code), installs the .deb in ubuntu:20.04 (glibc 2.31, the
# oldest that matters) on amd64 and arm64 and runs the installed hook (packaging/linux/smoke-test.sh), then
# attaches both packages and SHA256SUMS to the GitHub Release for the tag.
#
# The Release itself is normally created by release-windows.yml (tauri-action, ~8 minutes after the tag).
# This job finishes sooner, so it waits up to 25 minutes for that Release and creates it only if none
# appeared; tauri-action reuses an existing Release for the tag (getOrCreateRelease → getReleaseByTag), so
# either order works. Uploads use --clobber, so a re-run replaces the same assets.
#
# Push a version tag (v1.37.0) to build, test and attach; package.json's version must match the tag. Or run
# manually (workflow_dispatch) to build and test only (packages uploaded as a build artifact).
# Uses only the repository's GITHUB_TOKEN; no secrets. Two jobs: `build` (read-only token) builds, smoke-tests
# and uploads the packages as an artifact; `publish` (contents: write, tags only) runs no third-party action,
# checks the artifact against SHA256SUMS and attaches it. The one third-party action, docker/setup-qemu-action,
# is pinned to a full commit SHA and runs only in the read-only job.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != package.json v$v"; exit 1; }

      - name: Build the .deb and tarball
        run: |
          node scripts/build-linux-package.mjs --out dist/linux
          cd dist/linux
          sha256sum moorai_*_all.deb moorai-*-linux.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      # Install the .deb (first without Node: it must install and warn), install Node from nodejs.org
      # (checked against SHASUMS256.txt), register the hooks, run the installed hook on a benign Read (exit 0,
      # allowed) and on a credential Read under the fail-closed posture (deny). Any failure fails the job.
      - name: Smoke test on Ubuntu 20.04 (amd64, arm64)
        run: |
          for platform in linux/amd64 linux/arm64; do
            echo "::group::ubuntu:20.04 $platform"
            docker run --rm --platform "$platform" \
              -v "$PWD/dist/linux:/pkg:ro" \
              -v "$PWD/packaging/linux/smoke-test.sh:/smoke-test.sh:ro" \
              ubuntu:20.04 sh /smoke-test.sh
            echo "::endgroup::"
          done

      - name: Upload packages as a build artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: moorai-linux
          path: |
            dist/linux/moorai_*_all.deb
            dist/linux/moorai-*-linux.tar.gz
            dist/linux/SHA256SUMS
          if-no-files-found: warn

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # gh release create / upload write repo contents. No checkout and no third-party action in this job.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: moorai-linux
          path: dist/linux

      - name: Check the packages against SHA256SUMS
        run: cd dist/linux && sha256sum -c SHA256SUMS

      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          found=""
          for i in $(seq 1 50); do
            if out=$(gh release view "$TAG" --json tagName 2>&1); then found=1; break; fi
            printf '%s\n' "$out" | grep -q "release not found" || { printf '%s\n' "$out"; exit 1; }
            echo "waiting for the Release for $TAG ($i/50)"
            sleep 30
          done
          if [ -z "$found" ]; then
            echo "no Release for $TAG after 25 minutes; creating it"
            gh release create "$TAG" --verify-tag --title "MoorAI $TAG" \
              --notes "MoorAI agent $TAG. Linux: the .deb and tarball below (checksums in SHA256SUMS)." \
              || gh release view "$TAG" --json tagName
          fi
          gh release upload "$TAG" --clobber \
            dist/linux/moorai_*_all.deb \
            dist/linux/moorai-*-linux.tar.gz \
            dist/linux/SHA256SUMS
          gh release view "$TAG" --json assets --jq '.assets[].name'
